<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>KP CONSOLE</title>
<style>
:root{
 --bg:#08111f;--panel:#0f1b2d;--panel2:#13243a;--line:#223957;--text:#e8eef7;
 --muted:#8fa2bb;--accent:#4aa3ff;--accent2:#7bc5ff;--danger:#e46d7a;--ok:#50c58a;
 --shadow:0 10px 30px rgba(0,0,0,.22)
}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(135deg,#07101c,#0b1627 55%,#0b1422);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:238px;position:sticky;top:0;height:100vh;padding:20px 14px;background:rgba(8,17,31,.96);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:4px 10px 22px}.brand b{font-size:18px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:5px}
.nav{display:grid;gap:5px}.nav button{background:transparent;border:1px solid transparent;color:#aebed1;text-align:left;border-radius:10px;padding:10px 12px}.nav button.active{background:#122943;border-color:#20456b;color:#fff}.nav button:hover{background:#102238}
.sidebottom{margin-top:auto;display:grid;gap:7px}.sidebottom button{background:#0f1b2d;border:1px solid var(--line);color:#b9c7d8;border-radius:10px;padding:9px}
.main{width:100%;min-width:0}.topbar{position:sticky;top:0;z-index:5;background:rgba(8,17,31,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center}
.scenarioSelect{max-width:420px;flex:1;background:#101f33;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.content{max-width:1180px;margin:auto;padding:20px}
h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,rgba(17,31,50,.97),rgba(13,25,42,.97));border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.hero{padding:22px}.hero h1{font-size:27px;margin-bottom:6px}.eyebrow{font-size:12px;color:var(--accent2);letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d1b2d}.stat b{display:block;font-size:24px;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{font-size:12px;color:#aabbd0;font-weight:700;display:block;margin:9px 0 5px}input,textarea,select{width:100%;background:#091523;color:#eef5ff;border:1px solid #29415f;border-radius:10px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:#438fca;box-shadow:0 0 0 2px #438fca22}textarea{min-height:130px;resize:vertical}
.btn{border:1px solid #2e6a9d;background:#145386;color:#fff;border-radius:10px;padding:9px 12px}.btn:hover{filter:brightness(1.12)}.btn.ghost{background:#0d1b2d;border-color:var(--line);color:#c4d1df}.btn.danger{background:#4a1c26;border-color:#71303d;color:#ffd8de}.btn.ok{background:#174c3b;border-color:#286b53}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}
.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0c192a}.item:hover{border-color:#315a7e}.item .title{font-weight:700}.item .meta{font-size:11px;color:var(--muted);margin-top:4px}
.badge.pc{background:#102b46;color:#9ed5ff;border-color:#28577d}.badge.npc{background:#12332b;color:#9ee1c1;border-color:#2b6855}.badge.enemy{background:#351b24;color:#ffb7c0;border-color:#6c3040}.badge{font-size:10px;padding:3px 7px;border-radius:99px;background:#142a43;color:#9fcfff;border:1px solid #244b70}.badge.red{background:#321a22;color:#ffb4bf;border-color:#5d2b38}
.file{border:1px dashed #385572;border-radius:12px;padding:14px;background:#0a1726}.notice{border-left:3px solid var(--accent);padding:9px 11px;background:#0b1b2c;color:#b7c8da;border-radius:7px;font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.hidden{display:none!important}
a.link{color:#7fc5ff}.footer-note{font-size:11px;color:#71859c;margin-top:18px}
@media(max-width:820px){.sidebar{width:68px;padding:14px 8px}.brand b{font-size:0}.brand b:after{content:"✦";font-size:22px}.brand small{display:none}.nav button{font-size:0;text-align:center;padding:11px 4px}.nav button:first-letter{font-size:18px}.sidebottom{display:none}.content{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid,.grid3{grid-template-columns:1fr}.topbar{padding:10px}.scenarioSelect{max-width:none}.hero h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><b>KP CONSOLE</b><small>Scenario Keeper Workspace</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebottom"><button onclick="renameScenario()">✎ シナリオ名を変更</button><button onclick="show('backup')">⇅ 保存・復元</button></div>
</aside>
<section class="main">
  <div class="topbar">
    <select id="scenarioSelect" class="scenarioSelect" onchange="switchScenario(this.value)"></select>
    <button class="btn" onclick="newScenario()">＋ 新しいシナリオ</button>
  </div>
  <main class="content" id="content"></main>
</section>
</div>
<script>
const KEY="kp_console_v6";
const NAV=[
 ["home","⌂","ホーム"],["scenes","▤","シナリオ"],["kp","✦","KP情報"],["ho","◇","HO・秘匿"],
 ["pc","♙","キャラクター"],["npc","♧","NPC"],["enemy","⚔","敵"],["pdf","▣","PDF"],
 ["prep","✓","準備"]
];
let store=load();
let tab="home";
function blankScenario(name="新しいシナリオ"){return {id:(crypto.randomUUID?.()||String(Date.now()+Math.random())),name,scenes:[],kpInfo:"",hos:[],pcs:[],actors:{npc:[],enemy:[]},pdfs:[],prep:{}}}
function load(){
 try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x?.scenarios?.length)return x}catch(e){}
 const s=blankScenario("新しいシナリオ");return {scenarios:[s],currentId:s.id}
}
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function current(){return store.scenarios.find(s=>s.id===store.currentId)||store.scenarios[0]}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function init(){
 if(!store.scenarios?.length){const s=blankScenario();store.scenarios=[s];store.currentId=s.id}
 for(const s of store.scenarios){s.scenes??=[];s.hos??=[];s.pcs??=[];s.actors??={npc:[],enemy:[]};s.actors.npc??=[];s.actors.enemy??=[];s.pdfs??=[];s.prep??={}}
 save();drawNav();drawScenario();render()
}
function drawNav(){document.getElementById("nav").innerHTML=NAV.map(n=>`<button class="${tab===n[0]?'active':''}" onclick="show('${n[0]}')">${n[1]} <span>${n[2]}</span></button>`).join("")}
function drawScenario(){document.getElementById("scenarioSelect").innerHTML=store.scenarios.map(s=>`<option value="${esc(s.id)}" ${s.id===store.currentId?'selected':''}>${esc(s.name)}</option>`).join("")}
function show(t){tab=t;drawNav();render()}
function switchScenario(id){if(store.scenarios.some(s=>s.id===id)){store.currentId=id;save();render()}}
function newScenario(){const n=prompt("シナリオ名","新しいシナリオ");if(!n?.trim())return;const s=blankScenario(n.trim());store.scenarios.push(s);store.currentId=s.id;save();drawScenario();show("home")}
function renameScenario(){const s=current(),n=prompt("シナリオ名",s.name);if(n?.trim()){s.name=n.trim();save();drawScenario();render()}}
function deleteScenario(){if(store.scenarios.length===1)return alert("最後のシナリオは削除できません。");const s=current();if(!confirm(`「${s.name}」を削除しますか？`))return;store.scenarios=store.scenarios.filter(x=>x.id!==s.id);store.currentId=store.scenarios[0].id;save();drawScenario();show("home")}
function render(){const c=document.getElementById("content"),fn={home:home,scenes:scenes,kp:kp,ho:ho,pc:pc,npc:actor,enemy:actor,pdf:pdf,prep:prep,backup:backup}[tab];fn(c)}
function home(c){
 const s=current();c.innerHTML=`<div class="card hero"><div class="eyebrow">CURRENT SCENARIO</div><div class="row between"><div><h1>${esc(s.name)}</h1><p class="muted">長編シナリオを、読む・整理する・使うをひとつの画面で。</p></div><button class="btn ghost" onclick="renameScenario()">✎ 名前変更</button></div>
 <div class="stats"><div class="stat"><span>シーン</span><b>${s.scenes.length}</b></div><div class="stat"><span>KP情報</span><b>${s.kpInfo?1:0}</b></div><div class="stat"><span>キャラクター</span><b>${s.pcs.length}</b></div><div class="stat"><span>PDF</span><b>${s.pdfs.length}</b></div></div></div>
 <div class="grid"><div class="card"><h3>▤ シナリオ</h3><p class="muted small">本文・描写・公開情報・KP情報をシーン単位で整理。</p><button class="btn" onclick="show('scenes')">シーンを見る</button></div>
 <div class="card"><h3>✦ KP情報</h3><p class="muted small">回すときに必要な重要情報を独立して確認。</p><button class="btn" onclick="show('kp')">KP情報を見る</button></div>
 <div class="card"><h3>♙ キャラクター</h3><p class="muted small">URLを登録してすぐ開けるようにします。</p><button class="btn" onclick="show('pc')">キャラシを見る</button></div>
 <div class="card"><h3>▣ PDF</h3><p class="muted small">文章を端末内で読み取り、シーンへ整理。</p><button class="btn" onclick="show('pdf')">PDFを読み込む</button></div></div>
 <div class="card"><h3>運用の流れ</h3><div class="row"><span class="badge">01 シナリオ</span> → <span class="badge">02 PDF</span> → <span class="badge">03 整理</span> → <span class="badge">04 KP情報</span> → <span class="badge">05 ココフォリア用にコピー</span></div></div>
 <p class="footer-note">シナリオデータはこの端末のブラウザ内に保存されます。本文を外部サービスへ送信する機能はありません。</p>`
}
function scenes(c){
 const s=current();c.innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">SCENES</div><h2>シナリオ</h2></div><button class="btn" onclick="addScene()">＋ 新しいシーン</button></div></div>
 <div class="list">${s.scenes.map((x,i)=>`<div class="item"><div class="row between"><div><span class="badge">${String(i+1).padStart(2,"0")}</span> <span class="title">${esc(x.title)}</span></div><div class="row"><button class="btn ghost" onclick="openScene(${i})">開く</button><button class="btn danger" onclick="delScene(${i})">削除</button></div></div><div class="meta">${x.kp?'KP情報あり':'KP情報なし'}　${x.info?'公開情報あり':''}</div></div>`).join("")||`<div class="empty">シーンがまだありません。</div>`}</div>`
}
function addScene(){current().scenes.push({title:"新しいシーン",body:"",info:"",kp:""});save();show("scenes");}
function delScene(i){if(confirm("このシーンを削除しますか？")){current().scenes.splice(i,1);save();render()}}
function openScene(i){
 const x=current().scenes[i];document.getElementById("content").innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">SCENE ${i+1}</div><h2>シーン編集</h2></div><button class="btn ghost" onclick="show('scenes')">← 一覧</button></div>
 <label>タイトル</label><input value="${esc(x.title)}" oninput="current().scenes[${i}].title=this.value;save()">
 <label>本文・描写</label><textarea oninput="current().scenes[${i}].body=this.value;save()">${esc(x.body)}</textarea>
 <label>PLへ公開する情報</label><textarea oninput="current().scenes[${i}].info=this.value;save()">${esc(x.info)}</textarea>
 <label>KPだけが見る情報</label><textarea oninput="current().scenes[${i}].kp=this.value;save()">${esc(x.kp)}</textarea>
 <div class="row"><button class="btn" onclick="copyText(current().scenes[${i}].body+'\\n\\n'+current().scenes[${i}].info)">本文＋公開情報をコピー</button><button class="btn ghost" onclick="copyText(current().scenes[${i}].kp)">KP情報をコピー</button></div></div>`
}
function kp(c){
 const s=current();c.innerHTML=`<div class="card"><div class="eyebrow">KEEPER NOTES</div><div class="row between"><h2>KP情報</h2><button class="btn" onclick="copyText(current().kpInfo)">KP情報をコピー</button></div>
 <p class="muted small">シナリオ全体を回すときに重要な情報を、本文とは別にまとめます。</p><textarea style="min-height:320px" oninput="current().kpInfo=this.value;save()">${esc(s.kpInfo)}</textarea></div>`
}
function ho(c){
 const s=current();c.innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">SECRET HO</div><h2>HO・秘匿</h2></div><button class="btn" onclick="addHO()">＋ HO追加</button></div></div>
 <div class="grid">${s.hos.map((h,i)=>`<div class="card"><div class="row between"><h3>${esc(h.name)}</h3><button class="btn danger" onclick="sDelete('hos',${i})">削除</button></div>
 <label>HO名</label><input value="${esc(h.name)}" oninput="current().hos[${i}].name=this.value;save()"><label>秘匿</label><textarea oninput="current().hos[${i}].secret=this.value;save()">${esc(h.secret)}</textarea><label>KPメモ</label><textarea oninput="current().hos[${i}].memo=this.value;save()">${esc(h.memo)}</textarea><button class="btn" onclick="copyText(current().hos[${i}].secret)">秘匿をコピー</button></div>`).join("")||`<div class="empty">HOがまだありません。</div>`}</div>`
}
function addHO(){current().hos.push({name:`HO${current().hos.length+1}`,secret:"",memo:""});save();render()}
function sDelete(type,i){if(confirm("削除しますか？")){current()[type].splice(i,1);save();render()}}
function pc(c){
 const s=current();c.innerHTML=`<div class="card" style="border-color:#28577d"><div class="eyebrow">CHARACTERS</div><div class="row between"><div><h2>キャラクター</h2><p class="muted small">キャラシのページURLを登録して、ここからすぐ開けます。</p></div><span class="badge pc">♙ キャラシ</span></div>
 <div class="notice">いあきゃらのURLを貼り付けて保存できます。キャラシの内容をこのツールが取得することはありません。</div></div>
 <div class="grid">${s.pcs.map((p,i)=>`<div class="card" style="border-color:#234e70"><div class="row between"><h3>${esc(p.name)}</h3><span class="badge pc">キャラクター</span></div>
 <label>キャラクター名</label><input value="${esc(p.name)}" oninput="current().pcs[${i}].name=this.value;save()">
 <label>いあきゃらのURL</label><input value="${esc(p.url)}" placeholder="https://..." oninput="current().pcs[${i}].url=this.value;save()">
 <div class="row">${p.url?`<a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">→ いあきゃらを開く</a>`:"<span class='muted small'>URLを登録すると、ここに開くボタンが表示されます。</span>"}</div>
 <label>KP確認メモ</label><textarea oninput="current().pcs[${i}].memo=this.value;save()">${esc(p.memo)}</textarea>
 <button class="btn danger" onclick="sDelete('pcs',${i})">削除</button></div>`).join("")||`<div class="empty">キャラクターがまだありません。</div>`}</div>`
}
function addPC(){current().pcs.push({name:"新しいキャラクター",url:"",memo:""});save();render()}
function actor(c,type){
 const s=current(),label=type==="npc"?"NPC":"敵",cls=type,icon=type==="npc"?"♧":"⚔";
 c.innerHTML=`<div class="card" style="border-color:${type==="npc"?"#2b6855":"#6c3040"}"><div class="row between"><div><div class="eyebrow">${label.toUpperCase()}</div><h2>${label}</h2><p class="muted small">駒用のステータスと、KP用の設定を分けて管理できます。</p></div><span class="badge ${cls}">${icon} ${label}</span></div>
 <button class="btn" onclick="addActor('${type}')">＋ ${label}追加</button></div>
 <div class="grid">${s.actors[type].map((x,i)=>`<div class="card" style="border-color:${type==="npc"?"#245443":"#5c2937"}"><div class="row between"><h3>${esc(x.name)}</h3><span class="badge ${cls}">${label}</span></div>
 <label>名前</label><input value="${esc(x.name)}" oninput="current().actors.${type}[${i}].name=this.value;save()">
 <h4 style="margin:16px 0 4px">駒のステータス</h4>
 <div class="grid3"><div><label>HP</label><input value="${esc(x.hp)}" oninput="current().actors.${type}[${i}].hp=this.value;save()"></div><div><label>MP</label><input value="${esc(x.mp)}" oninput="current().actors.${type}[${i}].mp=this.value;save()"></div><div><label>DEX</label><input value="${esc(x.dex)}" oninput="current().actors.${type}[${i}].dex=this.value;save()"></div></div>
 <label>能力値</label><textarea oninput="current().actors.${type}[${i}].params=this.value;save()" placeholder="STR 12&#10;CON 10&#10;POW 15">${esc(x.params)}</textarea>
 <label>攻撃・技能・チャットパレット</label><textarea oninput="current().actors.${type}[${i}].commands=this.value;save()">${esc(x.commands)}</textarea>
 <h4 style="margin:16px 0 4px">KP用の設定・メモ</h4>
 <label>設定・背景</label><textarea oninput="current().actors.${type}[${i}].setting=this.value;save()" placeholder="人物像、背景、目的、秘密、登場時の様子など">${esc(x.setting||"")}</textarea>
 <label>KPメモ</label><textarea oninput="current().actors.${type}[${i}].memo=this.value;save()" placeholder="運用上の注意、出す情報、演出メモなど">${esc(x.memo)}</textarea>
 <div class="row"><button class="btn" onclick="copyActor('${type}',${i})">駒用データをコピー</button><button class="btn danger" onclick="delActor('${type}',${i})">削除</button></div></div>`).join("")||`<div class="empty">${label}がまだありません。</div>`}</div>`
}
function addActor(type){current().actors[type].push({name:type==="npc"?"NPC":"敵",hp:"",mp:"",dex:"",params:"",commands:"",setting:"",memo:""});save();render()}
function delActor(type,i){if(confirm("削除しますか？")){current().actors[type].splice(i,1);save();render()}}
function copyActor(type,i){const x=current().actors[type][i];copyText(JSON.stringify({name:x.name,hp:x.hp,mp:x.mp,dex:x.dex,params:x.params,commands:x.commands,setting:x.setting||''}))}
function pdf(c){
 const s=current();c.innerHTML=`<div class="card"><div class="eyebrow">SCENARIO PDF</div><h2>PDF</h2><p class="muted">PDFはこの端末内で処理します。本文を外部サービスへ送信する処理はありません。</p>
 <div class="file"><input id="pdfFile" type="file" accept="application/pdf"><p class="small muted">文字情報を含むPDFを選択してください。</p><progress id="prog" hidden max="1" value="0"></progress><div id="pdfStatus" class="small muted"></div></div></div>
 <div class="list">${s.pdfs.map((p,i)=>`<div class="item"><div class="row between"><div><span class="title">${esc(p.name)}</span><div class="meta">${p.pages}ページ　${p.text.length.toLocaleString()}文字</div></div><div class="row"><button class="btn ghost" onclick="copyText(current().pdfs[${i}].text)">全文をコピー</button><button class="btn" onclick="pdfToScenes(${i})">シーンに整理</button><button class="btn danger" onclick="delPDF(${i})">削除</button></div></div></div>`).join("")||`<div class="empty">PDFがまだありません。</div>`}</div>`
 document.getElementById("pdfFile").onchange=readPDF;
}
async function readPDF(e){
 const f=e.target.files?.[0];if(!f)return;const st=document.getElementById("pdfStatus"),pr=document.getElementById("prog");pr.hidden=false;st.textContent="PDFを読み込んでいます…";
 try{
  const bytes=new Uint8Array(await f.arrayBuffer());const text=await extractPDFText(bytes,(a)=>{pr.value=a;st.textContent=`PDFを解析中… ${Math.round(a*100)}%`});
  if(!text.trim())throw Error("no text");
  const pages=text.pages;current().pdfs.push({name:f.name,pages:pages.length,text:pages.map((x,i)=>`【${i+1}ページ】\n${x}`).join("\n\n")});save();st.textContent=`読み込み完了：${pages.length}ページ`;render()
 }catch(err){console.error(err);st.textContent="文字情報を抽出できませんでした。画像だけのPDFや特殊なPDFは、本文を手動で貼り付けてください。"}
}
async function extractPDFText(bytes,progress){
 const raw=new TextDecoder("latin1").decode(bytes);let chunks=[];
 const re=/stream\r?\n([\s\S]*?)\r?\nendstream/g;let m;while((m=re.exec(raw))){
   let obj=m[0],stream=m[1], decoded=stream;
   if(/\/FlateDecode/.test(raw.slice(Math.max(0,m.index-1200),m.index))){
     try{const b=new Uint8Array(stream.length);for(let i=0;i<stream.length;i++)b[i]=stream.charCodeAt(i)&255;
       if("DecompressionStream" in window){const ds=new DecompressionStream("deflate");const ab=await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer();decoded=new TextDecoder("latin1").decode(new Uint8Array(ab))}
     }catch(e){}
   }
   if(decoded.includes("Tj")||decoded.includes("TJ"))chunks.push(decoded);
 }
 if(!chunks.length)chunks=[raw];
 const pages=[];let cur=[];let seen=0;
 for(const ch of chunks){
   const txt=[];
   const rx=/\(((?:\\.|[^\\)])*)\)\s*Tj/g;let q;
   while((q=rx.exec(ch)))txt.push(decodePDFString(q[1]));
   const tj=/\[((?:[^\]]|\](?!\s*TJ))*)\]\s*TJ/g;
   while((q=tj.exec(ch))){for(const z of q[1].match(/\((?:\\.|[^\\)])*\)/g)||[])txt.push(decodePDFString(z.slice(1,-1)))}
   if(txt.length){cur.push(txt.join(" "));seen++;if(/BT[\s\S]*?ET/.test(ch)&&cur.length>0){pages.push(cur.join("\n"));cur=[]}}
   progress(Math.min(.95,seen/Math.max(chunks.length,1)))
 }
 if(cur.length)pages.push(cur.join("\n"));if(!pages.length)pages.push(chunks.map(x=>x.replace(/[^\x20-\x7e\u3000-\u9fff]+/g," ")).join("\n"));
 return {pages}
}
function decodePDFString(s){return s.replace(/\\([\\()])/g,"$1").replace(/\\n/g,"\n").replace(/\\r/g,"\r").replace(/\\t/g,"\t").replace(/\\([0-7]{1,3})/g,(_,o)=>String.fromCharCode(parseInt(o,8)))}
function pdfToScenes(i){const p=current().pdfs[i],blocks=p.text.split(/\n{2,}(?=【\d+ページ】)/).filter(Boolean);blocks.forEach((b,n)=>{const m=b.match(/^【(\d+)ページ】\n?([\s\S]*)$/);current().scenes.push({title:`PDF ${m?m[1]:n+1}ページ`,body:m?m[2]:b,info:"",kp:""})});save();show("scenes")}
function delPDF(i){if(confirm("このPDF情報を削除しますか？")){current().pdfs.splice(i,1);save();render()}}
function prep(c){
 const s=current();c.innerHTML=`<div class="card"><div class="eyebrow">PREPARATION</div><h2>ココフォリア用準備</h2><p class="muted small">コピーして、登録したい場所へ貼り付けるだけの準備画面。</p></div>
 <div class="grid"><div class="card"><h3>シーン</h3>${s.scenes.map((x,i)=>`<div class="row between"><span>${esc(x.title)}</span><button class="btn ghost" onclick="copyText(current().scenes[${i}].body+'\\n\\n'+current().scenes[${i}].info)">コピー</button></div>`).join("")||"<p class='muted'>なし</p>"}</div>
 <div class="card"><h3>駒</h3>${["npc","enemy"].flatMap(t=>s.actors[t].map((x,i)=>`<div class="row between"><span>${t==="npc"?"NPC":"敵"}：${esc(x.name)}</span><button class="btn ghost" onclick="copyActor('${t}',${i})">コピー</button></div>`)).join("")||"<p class='muted'>なし</p>"}</div></div>`
}
function backup(c){
 c.innerHTML=`<div class="card"><div class="eyebrow">DATA</div><h2>保存・復元</h2><p class="muted">現在のシナリオをファイルとして保存したり、別の端末へ移したりできます。</p><div class="row"><button class="btn" onclick="exportScenario()">書き出す</button><button class="btn ghost" onclick="importScenario()">読み込む</button><button class="btn danger" onclick="deleteScenario()">現在のシナリオを削除</button></div></div>
 <div class="card"><h3>保存について</h3><p class="small muted">シナリオ本文やPDFから抽出した文章は、このブラウザの保存領域に置かれます。別の端末と自動同期はしません。</p></div>`
}
function exportScenario(){const s=current(),b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=(s.name.replace(/[\\/:*?"<>|]/g,"_")||"scenario")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function importScenario(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.name)throw Error();s.id=current().id;store.scenarios[store.scenarios.findIndex(x=>x.id===current().id)]=s;save();drawScenario();render();alert("読み込みました")}catch(e){alert("保存データを読み込めませんでした")}};r.readAsText(f)};i.click()}
function copyText(t){const s=String(t??"");if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast("コピーしました")).catch(()=>fallbackCopy(s));else fallbackCopy(s)}
function fallbackCopy(s){const t=document.createElement("textarea");t.value=s;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast("コピーしました")}
function toast(msg){const x=document.createElement("div");x.textContent=msg;x.style="position:fixed;right:18px;bottom:18px;background:#17304a;color:#fff;border:1px solid #315878;padding:10px 14px;border-radius:10px;z-index:99";document.body.appendChild(x);setTimeout(()=>x.remove(),1400)}
init();
</script>
