.helpBody{padding:0 14px 15px 52px;color:var(--muted);line-height:1.75}
.pdfDestination{margin-top:12px}
.pdfDestination select{min-width:220px;max-width:100%;padding:9px}
.pdfDestination input{min-width:220px;flex:1}

.scenePartColumns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.sceneColumn{min-width:0}.sceneScroll{max-height:60vh;overflow-y:auto;padding:2px 7px 12px 2px;overscroll-behavior:contain}.dialogueScroll{max-height:38vh}.scenePart{margin:10px 0}.scenePartText{min-height:150px;width:100%;box-sizing:border-box}.kpSceneText{min-height:180px;width:100%;box-sizing:border-box}.dialoguePart{border-left:3px solid #a56b87}@media(max-width:850px){.scenePartColumns{grid-template-columns:1fr}.sceneScroll{max-height:50vh}.dialogueScroll{max-height:40vh}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><b>KP CONSOLE</b><small>Scenario Keeper Workspace</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebottom"><button onclick="renameScenario()">✎ シナリオ名を変更</button><button onclick="show('backup')">⇅ 保存・復元</button></div>
</aside>
<section class="main">
  <div class="topbar">
    <select id="scenarioSelect" class="scenarioSelect" onchange="switchScenario(this.value)"></select>
    <button class="btn ghost renameTopBtn" onclick="renameScenario()">✎ 名前変更</button><button class="btn ok" onclick="saveCurrentScenario()">✓ 保存</button>
    <button class="btn ghost" onclick="downloadCurrentScenario()">⇩ ファイル保存</button>
    <button class="btn danger" onclick="deleteScenario()">削除</button>
    <button class="btn" onclick="newScenario()">＋ 新しいシナリオ</button>
  </div>
  <main class="content" id="content"></main>
</section>
</div>
<script>
async function importPlainTextFile(file){
 const text=await file.text();
 const normalized=(typeof normalizeExtractedText==="function")
   ? normalizeExtractedText(text)
   : text.replace(/\r\n?/g,"\n").trim();
 current().pdfs??=[];
 current().pdfs.push({
   name:file.name||"テキストファイル",
   type:"text",
   text:normalized,
   rawText:normalized,
   pages:[{page:1,text:normalized}]
 });
 save();
 render();
 if(typeof toast==="function") toast("テキストを読み込みました");
}

const KEY="kp_console_v6";
const NAV=[
 ["home","⌂","ホーム"],["session","▶","今ここ"],["search","⌕","検索"],["scenes","▤","シナリオ"],
 ["kp","✦","KP情報"],["ho","◇","HO・秘匿"],["pc","♙","PC・キャラクター"],
 ["npc","♧","NPC・登場人物"],["enemy","⚔","敵・エネミー"],["pdf","▣","PDF"],["prep","✓","準備"]
];
let store=load();
let tab="home";
function blankScenario(name="新しいシナリオ"){
 return {id:(crypto.randomUUID?.()||String(Date.now()+Math.random())),name,scenes:[],kpInfo:"",hos:[],pcs:[],
 actors:{npc:[],enemy:[]},pdfs:[],prep:{},bookmarks:[],session:{currentScene:0,checks:{}}}
}
function load(){
 try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x?.scenarios?.length)return x}catch(e){}
 const s=blankScenario("新しいシナリオ");return {scenarios:[s],currentId:s.id}
}
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
const PDF_DB="coc_kp_pdf_originals";
function openPDFDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(PDF_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putPDFOriginal(id,file){try{const db=await openPDFDB();await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){console.warn("PDF原本の保存に失敗",e)}}
async function getPDFOriginal(id){if(!id)return null;try{const db=await openPDFDB();const v=await new Promise((res,rej)=>{const tx=db.transaction("files","readonly");const r=tx.objectStore("files").get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});db.close();return v}catch(e){return null}}
async function deletePDFOriginal(id){if(!id)return;try{const db=await openPDFDB();await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
async function openOriginalPDF(pdfIndex,sourceIndex=0){
 const p=current().pdfs[pdfIndex],id=p?.originalIds?.[sourceIndex],file=await getPDFOriginal(id);
 if(!file){toast("このPDFの原本は保存されていません。PDFを登録し直してください。");return}
 document.getElementById("pdfViewerModal")?.remove();
 const m=document.createElement("div");m.id="pdfViewerModal";m.className="pdfViewerModal";
 m.innerHTML=`<div class="pdfViewerHead"><div><b>${esc(file.name||p.name)}</b><div class="small muted">原本上の文章をドラッグ（スマホは長押し）して選択できます。</div></div><div class="pdfViewerButtons"><button class="btn" onclick="extractViewerSelection()">選択範囲を抽出</button><button class="btn ghost" onclick="copyViewerSelection()">コピー</button><button class="btn ghost" onclick="closePDFViewer()">閉じる</button></div></div><div id="pdfOriginalPages" class="pdfOriginalPages"></div>`;
 m.dataset.pdfIndex=pdfIndex;m.dataset.sourceIndex=sourceIndex;document.body.appendChild(m);
 const url=URL.createObjectURL(file);m.dataset.url=url;
 try{
  const pdfjs=await loadPDFjs(),doc=await pdfjs.getDocument({url}).promise,wrap=m.querySelector("#pdfOriginalPages");
  for(let n=1;n<=doc.numPages;n++){
   const sec=document.createElement("section");sec.className="originalPage";
   sec.innerHTML=`<div class="originalPageHead"><b>PAGE ${String(n).padStart(3,"0")}</b><span class="small muted">文章選択可能</span></div><div class="originalCanvasWrap"><div class="pageStage"><canvas></canvas><div class="pdfTextLayer"></div></div></div>`;
   wrap.appendChild(sec);
   const page=await doc.getPage(n),base=page.getViewport({scale:1}),maxW=Math.min(Math.max(280,wrap.clientWidth-28),900),scale=Math.min(1.5,maxW/base.width),vp=page.getViewport({scale});
   const stage=sec.querySelector(".pageStage"),canvas=sec.querySelector("canvas"),layer=sec.querySelector(".pdfTextLayer");
   stage.style.width=vp.width+"px";stage.style.height=vp.height+"px";canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
   await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
   const tc=await page.getTextContent();
   for(const it of tc.items){
    const str=String(it.str||"");if(!str.trim())continue;
    const tr=it.transform||[1,0,0,1,0,0],pt=vp.convertToViewportPoint(tr[4],tr[5]),fs=Math.max(7,Math.hypot(tr[0]||0,tr[1]||0)*scale);
    const sp=document.createElement("span");sp.textContent=str;sp.style.left=pt[0]+"px";sp.style.top=(pt[1]-fs)+"px";sp.style.fontSize=fs+"px";layer.appendChild(sp);
   }
  }
 }catch(e){console.error(e);toast("PDFを表示できませんでした")}
}
function viewerSelection(){
 const sel=window.getSelection(),root=document.getElementById("pdfOriginalPages");
 if(!sel||sel.isCollapsed||!root||!root.contains(sel.anchorNode)||!root.contains(sel.focusNode))return "";
 return sel.toString().replace(/\u00a0/g," ").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function copyViewerSelection(){const t=viewerSelection();if(!t)return toast("原本の文章を選択してください");copyText(t)}
function extractViewerSelection(){
 const t=viewerSelection();if(!t)return toast("原本の文章を選択してください");
 const s=current();s.selectedPDFExtracts??=[];s.selectedPDFExtracts.push({text:t,at:Date.now()});save();toast("選択した文章を抽出結果として保存しました");
}
function closePDFViewer(){const m=document.getElementById("pdfViewerModal");if(!m)return;const u=m.dataset.url;m.remove();if(u)URL.revokeObjectURL(u)}

function current(){return store.scenarios.find(s=>s.id===store.currentId)||store.scenarios[0]}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function init(){
 if(!store.scenarios?.length){const s=blankScenario();store.scenarios=[s];store.currentId=s.id}
 for(const s of store.scenarios){s.scenes??=[];s.hos??=[];s.pcs??=[];s.actors??={npc:[],enemy:[]};s.actors.npc??=[];s.actors.enemy??=[];
   for(const type of ["npc","enemy"]){for(const a of s.actors[type]){a.name??=type==="npc"?"NPC":"敵";a.hp??="";a.mp??="";a.dex??="";a.params??="";a.skills??="";a.commands??="";a.setting??="";a.memo??=""}}
   s.pdfs??=[];s.variables??={ho:[],pc:[],kpc:[]};s.variables.ho??=[];s.variables.pc??=[];s.variables.kpc??=[];for(const p of s.pdfs){if(!Array.isArray(p.pageData)&&p.text)p.pageData=getPDFPages(p)}s.prep??={}}
 save();drawNav();drawScenario();render()
}
function drawNav(){
 document.getElementById("nav").innerHTML=NAV.map(n=>`<button class="navBtn ${tab===n[0]?'active':''}" onclick="show('${n[0]}')" title="${esc(n[2])}">
   <span class="navIcon">${n[1]}</span><span class="navText">${n[2]}</span>
 </button>`).join("")
}
function drawScenario(){
 const el=document.getElementById("scenarioSelect");
 if(!el)return;
 el.innerHTML=store.scenarios.map(s=>`<option value="${esc(s.id)}" ${s.id===store.currentId?'selected':''}>${esc(s.name)}</option>`).join("");
}
function show(t){tab=t;drawNav();render()}
function repairCurrentData(){
 const s=current();
 s.scenes??=[];s.hos??=[];s.pcs??=[];s.actors??={npc:[],enemy:[]};
 s.actors.npc??=[];s.actors.enemy??=[];s.pdfs??=[];s.prep??={};s.kpInfo??="";s.variables??={ho:[],pc:[],kpc:[]};s.variables.ho??=[];s.variables.pc??=[];s.variables.kpc??=[];
 s.bookmarks??=[];s.session??={currentScene:0,checks:{}};
 s.session.currentScene=Number.isInteger(s.session.currentScene)?s.session.currentScene:0;s.session.checks??={};
 for(const x of s.scenes){x.title??="無題";x.body??="";x.info??="";x.kp??="";x.tags??=[];x.checks??={body:false,info:false,judge:false,next:false}}
}function switchScenario(id){if(store.scenarios.some(s=>s.id===id)){store.currentId=id;save();render()}}
function newScenario(){const n=prompt("シナリオ名","新しいシナリオ");if(!n?.trim())return;const s=blankScenario(n.trim());store.scenarios.push(s);store.currentId=s.id;save();drawScenario();show("home")}
function saveCurrentScenario(){
 save();
 drawScenario();
 toast(`「${current().name}」を保存しました`);
}
function downloadCurrentScenario(){
 const s=current();
 const payload=JSON.stringify(s);
 const b=new Blob([payload],{type:"application/octet-stream"});
 const u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=(s.name.replace(/[\\/:*?"<>|]/g,"_")||"scenario")+".coc-kp";
 a.click();setTimeout(()=>URL.revokeObjectURL(u),500);
 toast("シナリオファイルを保存しました");
}
function renameScenario(){const s=current(),n=prompt("シナリオ名",s.name);if(n?.trim()){s.name=n.trim();save();drawScenario();render()}}
function deleteScenario(){
 const s=current();
 if(!confirm(`「${s.name}」を削除しますか？\n登録したPDF・シーン・キャラクター情報も削除されます。`))return;
 store.scenarios=store.scenarios.filter(x=>x.id!==s.id);
 if(!store.scenarios.length){const n=blankScenario("新しいシナリオ");store.scenarios=[n];store.currentId=n.id}
 else store.currentId=store.scenarios[0].id;
 save();drawScenario();show("home")
}

function deletePdf(index){
 const s=current(); if(!s.pdfs[index])return;
 if(confirm(`「${s.pdfs[index].name||"PDF資料"}」を削除しますか？`)){s.pdfs.splice(index,1);save();render()}
}
function deleteActor(type,index){
 const a=current().actors[type]; if(!a[index])return;
 if(confirm(`「${a[index].name||"登録データ"}」を削除しますか？`)){a.splice(index,1);save();render()}
}
function deletePC(index){
 const a=current().pcs; if(!a[index])return;
 if(confirm(`「${a[index].name||"PC"}」を削除しますか？`)){a.splice(index,1);save();render()}
}
function deleteHO(index){
 const a=current().hos; if(!a[index])return;
 if(confirm(`「${a[index].name||"HO"}」を削除しますか？`)){a.splice(index,1);save();render()}
}

function normalizeIaCharaUrl(raw){
 const v=String(raw||"").trim();
 if(!v)return "";
 return /^https?:\/\//i.test(v)?v:"https://"+v;
}
function setIaCharaUrl(index){
 const s=current(),pc=(s.pcs||[])[index]; if(!pc)return;
 const v=prompt("いあきゃらのキャラクターURLを入力してください",pc.iaCharaUrl||pc.url||"");
 if(v===null)return;
 const u=normalizeIaCharaUrl(v);
 if(u&&!/^https?:\/\/.+/i.test(u))return toast("URLの形式を確認してください");
 pc.iaCharaUrl=u;pc.url=u;save();render();
}
function openIaCharaUrl(index){
 const pc=current().pcs?.[index],u=normalizeIaCharaUrl(pc?.iaCharaUrl||pc?.url);
 if(!u)return toast("いあきゃらのURLを登録してください");
 window.open(u,"_blank","noopener,noreferrer");
}

function variableNames(){
 const s=current();s.variables??={ho:[],pc:[],kpc:[]};
 return s.variables;
}
function addVariable(kind,sceneIndex=null){
 const v=prompt(kind==="ho"?"HO名を入力（例：東、視線）":kind==="pc"?"PC名を入力（例：東、視線）":"KPCの変数名を入力", "");
 if(v===null||!v.trim())return;
 const key=v.trim(),a=variableNames()[kind];
 if(!a.includes(key))a.push(key);
 save();
 if(Number.isInteger(sceneIndex))openScene(sceneIndex);else render();
 toast("登録しました");
}
function removeVariable(kind,i,sceneIndex=null){
 variableNames()[kind].splice(i,1);save();
 if(Number.isInteger(sceneIndex))openScene(sceneIndex);else render();
}

function variablePanel(sceneIndex=null){
 const v=variableNames();
 return `<div class="card variablePanel"><div class="eyebrow">COCOFOLIA VARIABLES</div><h3>ココフォリア変数</h3><p class="muted small">登録した名前だけを「HO1」「PC」「KPC」などから {HO1} の形に変換します。</p>
 <div class="variableGroup"><b>HO</b>${v.ho.map((x,i)=>`<span class="varChip">HO${esc(x)} <button onclick="removeVariable('ho',${i},${sceneIndex===null?'null':sceneIndex})">×</button></span>`).join("")}<button class="btn ghost" onclick="addVariable('ho',${sceneIndex===null?'null':sceneIndex})">＋ HO名</button></div>
 <div class="variableGroup"><b>PC</b>${v.pc.map((x,i)=>`<span class="varChip">PC${esc(x)} <button onclick="removeVariable('pc',${i},${sceneIndex===null?'null':sceneIndex})">×</button></span>`).join("")}<button class="btn ghost" onclick="addVariable('pc',${sceneIndex===null?'null':sceneIndex})">＋ PC名</button></div>
 <div class="variableGroup"><b>KPC</b>${v.kpc.map((x,i)=>`<span class="varChip">${esc(x)} <button onclick="removeVariable('kpc',${i},${sceneIndex===null?'null':sceneIndex})">×</button></span>`).join("")}<button class="btn ghost" onclick="addVariable('kpc',${sceneIndex===null?'null':sceneIndex})">＋ KPC名</button></div></div>`;
}
function openVariableSettings(){
 const s=current(),v=variableNames();
 let msg="変数化する名前を登録します。\\n\\nHO: "+(v.ho.join(", ")||"なし")+"\\nPC: "+(v.pc.join(", ")||"なし")+"\\nKPC: "+(v.kpc.join(", ")||"なし");
 alert(msg+"\\n\\n本文では、登録した名前を使って「HO東」「PC東」「KPC」などを {HO東} / {PC東} / {KPC} に変換できます。");
}
function variableizeText(text){
 const v=variableNames(), names=[];
 v.ho.forEach(x=>names.push("HO"+x)); v.pc.forEach(x=>names.push("PC"+x)); v.kpc.forEach(x=>names.push(x.startsWith("KPC")?x:"KPC"+x));
 names.sort((a,b)=>b.length-a.length);
 let out=String(text||"");
 for(const n of names){
  const esc=n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  out=out.replace(new RegExp("(?<!\\{)"+esc+"(?!\\})","g"),"{"+n+"}");
 }
 return out;
}
function variableizeScene(sceneIndex,field){
 const s=current(),sc=s.scenes?.[sceneIndex];if(!sc)return;
 sc[field]=variableizeText(sc[field]||"");save();openScene(sceneIndex);toast("ココフォリア変数に変換しました");
}
function render(){
 repairCurrentData();drawScenario();
 const c=document.getElementById("content");
 ({home,session,search,scenes,kp,ho,pc,npc:(x)=>actor(x,"npc"),enemy:(x)=>actor(x,"enemy"),pdf,prep}[tab]||home)(c);
}
function home(c){
 const s=current(),total=s.scenes.length,cur=Math.min(Math.max(s.session.currentScene||0,0),Math.max(total-1,0));
 const x=s.scenes[cur],done=x?Object.values(x.checks||{}).filter(Boolean).length:0;
 c.innerHTML=`<div class="hero card"><div class="eyebrow">KP DASHBOARD</div><h1>${esc(s.name)}</h1>
 <p class="muted">シナリオの準備から本番中の進行まで、ここをKP用の司令塔として使えます。</p>
 <div class="stats"><div class="stat"><span>シーン</span><b>${total}</b></div><div class="stat"><span>PDF資料</span><b>${s.pdfs.length}</b></div><div class="stat"><span>PC</span><b>${s.pcs.length}</b></div><div class="stat"><span>NPC / 敵</span><b>${s.actors.npc.length} / ${s.actors.enemy.length}</b></div></div></div>
 <div class="grid"><div class="card"><div class="row between"><div><div class="eyebrow">CURRENT</div><h2>${x?esc(x.title):"シーン未登録"}</h2><p class="muted small">${x?`シーン ${cur+1} / ${total}`:"まずシーンを作成してください。"}</p></div><button class="btn" onclick="show('session')">今ここを開く</button></div>
 ${x?`<div class="progressLine"><span style="width:${done*25}%"></span></div><div class="small muted">進行チェック ${done}/4</div>`:""}</div>
 <div class="card"><div class="eyebrow">QUICK SEARCH</div><h2>必要な情報を探す</h2><div class="row"><input id="homeSearch" placeholder="NPC名、技能、SAN、キーワード…" onkeydown="if(event.key==='Enter')runSearch(this.value)"><button class="btn" onclick="runSearch(document.getElementById('homeSearch').value)">検索</button></div></div></div>
 <div class="card"><div class="eyebrow">QUICK ACTION</div><div class="row"><button class="btn" onclick="addScene()">＋ シーン</button><button class="btn" onclick="show('pdf')">▣ PDFを整理</button><button class="btn" onclick="show('npc')">♧ NPC</button><button class="btn" onclick="show('enemy')">⚔ 敵</button><button class="btn ghost" onclick="show('prep')">✓ 準備チェック</button><button class="btn ghost" onclick="backup(document.getElementById('content'))">⇩ 保存・復元</button></div></div>`;
}function setCurrentScene(i){const s=current();if(!s.scenes.length)return;s.session.currentScene=Math.max(0,Math.min(i,s.scenes.length-1));save();show("session")}
function toggleSceneCheck(i,k,v){current().scenes[i].checks[k]=v;save()}
function session(c){
 const s=current(),total=s.scenes.length;
 if(!total){c.innerHTML='<div class="empty">シーンがまだありません。<br><button class="btn" onclick="addScene()">＋ シーンを作る</button></div>';return}
 const i=Math.max(0,Math.min(s.session.currentScene||0,total-1)),x=s.scenes[i],checks=x.checks||{};
 c.innerHTML=`<div class="card nowCard"><div class="row between"><div><div class="eyebrow">NOW PLAYING</div><h1>${esc(x.title)}</h1><div class="muted small">SCENE ${i+1} / ${total}</div></div><div class="row"><button class="btn ghost" onclick="setCurrentScene(${i-1})" ${i===0?"disabled":""}>← 前</button><button class="btn" onclick="setCurrentScene(${i+1})" ${i===total-1?"disabled":""}>次 →</button></div></div>
 <div class="row sessionChecks">${[["body","描写済み"],["info","情報提示済み"],["judge","判定済み"],["next","次への条件確認"]].map(([k,l])=>`<label class="check"><input type="checkbox" ${checks[k]?"checked":""} onchange="toggleSceneCheck(${i},'${k}',this.checked)"><span>${l}</span></label>`).join("")}</div></div>
 <div class="sessionGrid"><div class="card sessionMain"><div class="row between"><h2>本文</h2><button class="btn ghost" onclick="copyText(current().scenes[${i}].body)">コピー</button></div><div class="sessionText">${nl2br(x.body)}</div></div>
 <div class="card"><div class="row between"><h2>公開情報</h2><button class="btn ghost" onclick="copyText(current().scenes[${i}].info)">コピー</button></div><div class="sessionText">${nl2br(x.info)||'<span class="muted">なし</span>'}</div></div>
 <div class="card kpPanel"><div class="row between"><h2>KP情報</h2><button class="btn ghost" onclick="copyText(current().scenes[${i}].kp)">コピー</button></div><div class="sessionText">${nl2br(x.kp)||'<span class="muted">なし</span>'}</div></div></div>`;
}
function nl2br(v){return esc(v||"").replace(/\n/g,"<br>")}
function runSearch(q){show("search");setTimeout(()=>{const el=document.getElementById("searchInput");if(el){el.value=q||"";renderSearchResults(q||"")}},30)}
function search(c){c.innerHTML=`<div class="card"><div class="eyebrow">SEARCH</div><h2>シナリオ内検索</h2><div class="row"><input id="searchInput" placeholder="NPC名、技能、SAN、キーワード…" oninput="renderSearchResults(this.value)" autofocus><button class="btn ghost" onclick="this.closest('.card').querySelector('input').value='';renderSearchResults('')">クリア</button></div><p class="muted small">シーン、KP情報、HO、PC、NPC、敵、PDFを横断検索します。</p></div><div id="searchResults"></div>`;renderSearchResults("")}
function renderSearchResults(q){
 const box=document.getElementById("searchResults");if(!box)return;q=String(q||"").trim().toLowerCase();if(!q){box.innerHTML='<div class="empty">キーワードを入力してください。</div>';return}
 const s=current(),r=[],hit=(title,label,text,action)=>{if(String(text||"").toLowerCase().includes(q))r.push({title,label,text,action})};

function renameScene(i){

function ensureSceneParts(sc){
 sc.parts??=[];
 if(!Array.isArray(sc.parts)) sc.parts=[];
 if(!sc.parts.length){
  sc.parts=[{type:"body",title:"描写 1",text:sc.body||"",done:false},
            {type:"public",title:"公開情報 1",text:sc.info||"",revealed:false,judged:false}];
 }

}

 const sc=current().scenes?.[i]; if(!sc)return;

 parts.push(type==="body"
  ? {type:"body",title:`描写 ${parts.filter(x=>x.type==="body").length+1}`,text:"",done:false}
  : {type:"public",title:`公開情報 ${parts.filter(x=>x.type==="public").length+1}`,text:"",revealed:false,judged:false});
 save(); openScene(i);
}
function removeScenePart(i,pi){

 const parts=ensureSceneParts(sc); parts.splice(pi,1);

 sc.info=parts.filter(x=>x.type==="public").map(x=>x.text).join("\n\n");
 save(); openScene(i);
}
function updateScenePart(i,pi,key,val){

function getPDFPages(p){ if(p?.type==="text" && (!p.pages||!p.pages.length)) return [{page:1,text:p.text||""}];
 if(Array.isArray(p.pageData)&&p.pageData.length)return p.pageData.map(x=>({page:x.page,text:x.text||""}));
 const chunks=String(p.text||"").split(/\n\n(?=【\d+ページ】)/).filter(Boolean);
 return chunks.map((x,i)=>{const m=x.match(/^【(\d+)ページ】\n?([\s\S]*)$/);return {page:m?Number(m[1]):i+1,text:m?m[2]:x}});
}

function splitParagraphs(text){
 const raw=String(text||"").replace(/\r/g,"").split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
 if(raw.length)return raw;
 return String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
}
function copyParagraph(i,n){const p=current().pdfs[i],pages=getPDFPages(p),paras=splitParagraphs(pages[n]?.text||"");if(paras.length&&paras[n]!==undefined)copyText(paras[n])}
function copyPDFPageParagraph(pdfIndex,pageIndex,paraIndex){const p=current().pdfs[pdfIndex],pages=getPDFPages(p),t=splitParagraphs(pages[pageIndex]?.text||"")[paraIndex]||"";if(t)copyText(t)}
function attachOriginalPDF(index,file){if(!file)return;const p=current().pdfs[index];const id=(crypto.randomUUID?.()||String(Date.now()+Math.random()));p.originalIds=[id];p.sources=[file.name];putPDFOriginal(id,file).then(()=>{save();render();toast("PDF原本を登録しました")})}
function previewPDF(i){

async function loadPDFjs(){
 if(window.pdfjsLib)return window.pdfjsLib;
 // The module is loaded dynamically so normal app use does not depend on PDF.js.
 const mod=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
 mod.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
 window.pdfjsLib=mod;
 return mod;
}

async function readPDFs(e){
 const files=Array.from(e.target.files||[]);if(!files.length)return;
 const st=document.getElementById("pdfStatus"),pr=document.getElementById("prog"),ocrOn=document.getElementById("pdfOcr")?.checked!==false;pr.hidden=false;pr.value=0;
 try{
  const all=[],originalIds=[],sources=[];
  for(let fi=0;fi<files.length;fi++){
   const file=files[fi],id=(crypto.randomUUID?.()||String(Date.now()+Math.random()));
 if(file && /\.(txt|text)$/i.test(file.name||"")){ importPlainTextFile(file); return; }

   const result=await extractPDFWithPDFJS(new Uint8Array(await file.arrayBuffer()),false,(a,msg)=>{pr.value=(fi+a)/files.length;st.textContent=`${fi+1}/${files.length}：${msg}`});
   await putPDFOriginal(id,file);originalIds.push(id);sources.push(file.name);
   result.pages.forEach((text,pi)=>all.push({page:all.length+1,text,source:file.name,sourcePage:pi+1}));
  }
  current().pdfs.push({id:crypto.randomUUID?.()||String(Date.now()),name:files.length===1?files[0].name:`${files[0].name} ほか${files.length-1}冊`,pages:all.length,text:all.map(x=>`【${x.source} / ${x.sourcePage}ページ】\n${x.text}`).join("\n\n"),pageData:all,sources,originalIds});
  save();st.textContent=`${files.length}冊を1つの資料として登録しました（${all.length}ページ）`;render();
 }catch(err){console.error(err);st.textContent="PDFを読み込めませんでした。"}
}
async function extractPDFWithPDFJS(bytes,doOCR,progress){
 const pdfjs=await loadPDFjs(),pdf=await pdfjs.getDocument({data:bytes}).promise,pages=[],pageData=[];
 const clean=s=>String(s||"").replace(/\u00a0/g," ").replace(/[ \t]+/g," ").trim();
 const isMark=(s,y,h)=>{
  const t=clean(s).replace(/\s/g,"");
  return /^(?:0*\d{1,4}P|P0*\d{1,4})$/i.test(t) ||
   (/^(?:Page|PAGE|p)?0*\d{1,4}(?:[\/／]0*\d{1,4})?$/.test(t)&&(y<h*.12||y>h*.88));
 };
 const rebuild=items=>{
  const rows=[];
  for(const it of items){
   let r=rows.find(x=>Math.abs(x.y-it.y)<Math.max(3,it.fs*.35));
   if(!r){r={y:it.y,items:[]};rows.push(r)} r.items.push(it);
  }
  rows.sort((a,b)=>b.y-a.y);
  const lines=rows.map(r=>{
   r.items.sort((a,b)=>a.x-b.x);let line="";
   for(let i=0;i<r.items.length;i++){
    const it=r.items[i],pr=r.items[i-1];
    if(pr){
     const gap=it.x-(pr.x+pr.w);
     if(gap>Math.max(pr.fs,it.fs)*.35&&!/[「『（【［(]$/.test(line)&&!/[、。，．」』）】］)]/.test(it.str[0]||""))line+=" ";
    }
    line+=it.str;
   }
   return clean(line);
  }).filter(Boolean);
  const out=[];
  for(const line of lines){
   if(!out.length){out.push(line);continue}
   const prev=out[out.length-1];
   const soft=!/[。！？!?：:」』）】]$/.test(prev)&&
    !/^[・●○◆◇■□▶▷★☆\-—–]/.test(line)&&
    !/^\d+[.)、]/.test(line)&&
    !/^(?:「|『|【|［|\[)/.test(line)&&
    !/[。！？!?]$/.test(line)&&prev.length<70;
   if(soft)out[out.length-1]=prev+line;else out.push(line);
  }
  return out.join("\n");
 };
 for(let n=1;n<=pdf.numPages;n++){
  progress((n-1)/pdf.numPages,`PDFを解析中… ${n}/${pdf.numPages}ページ`);
  const page=await pdf.getPage(n),tc=await page.getTextContent(),vp=page.getViewport({scale:1}),h=vp.height;
  const items=tc.items.map(x=>{
   const tr=x.transform||[];
   return {str:String(x.str||""),x:Number(tr[4]||0),y:Number(tr[5]||0),w:Number(x.width||0),fs:Math.max(1,Math.hypot(tr[0]||0,tr[1]||0))}
  }).filter(x=>x.str.trim()&&!isMark(x.str,x.y,h)&&!(x.fs<6.2&&x.str.trim().length<=10));
  const text=rebuild(items);pages.push(text);pageData.push({page:n,text});
 }
 progress(1,"読み込み完了");return {pages,pageData};
}


function pdfSceneOptions(selected){
 const s=current();

function ensurePDFDestination(){

 return sel?Number(sel.value):-1;

 if(sel){sel.innerHTML=pdfSceneOptions(s.scenes.length-1);sel.value=String(s.scenes.length-1);}

function addPDFTextToDestination(pdfIndex,pageIndex,paraIndex,field){
 const p=current().pdfs[pdfIndex],pages=getPDFPages(p),t=splitParagraphs(pages[pageIndex]?.text||"")[paraIndex]||"";
 const n=ensurePDFDestination();
 if(!t||!Number.isInteger(n)||n<0||n>=current().scenes.length)return toast("追加先のシーンを選択してください");
 const s=current(),sc=s.scenes[n];
 ensureSceneParts(sc);
 const type=field==="body"?"body":field==="info"?"public":null;
 if(type){
   const parts=ensureSceneParts(sc), arr=parts.filter(x=>x.type===type);
   const part=arr[arr.length-1];
   if(part){part.text=(part.text?part.text+"\n\n":"")+t}
   else parts.push(type==="body"?{type:"body",title:"描写 1",text:t,done:false}:{type:"public",title:"公開情報 1",text:t,revealed:false,judged:false});
   sc.body=parts.filter(x=>x.type==="body").map(x=>x.text).join("\n\n");
   sc.info=parts.filter(x=>x.type==="public").map(x=>x.text).join("\n\n");
 }else sc.kp=(sc.kp?sc.kp+"\n\n":"")+t;
 save(); toast(`「${sc.title}」へ追加しました`);
}
function addSelectedPDFToDestination(pdfIndex,field){
 const t=selectedPDFText();
 if(!t)return toast("PDFプレビューで範囲を選択してください");
 const n=ensurePDFDestination();
 if(!Number.isInteger(n)||n<0||n>=current().scenes.length)return toast("追加先のシーンを選択してください");
 const sc=current().scenes[n]; ensureSceneParts(sc);
 if(field==="body"||field==="info"){
   const type=field==="body"?"body":"public",parts=ensureSceneParts(sc),arr=parts.filter(x=>x.type===type),part=arr[arr.length-1];
   if(part)part.text=(part.text?part.text+"\n\n":"")+t;
   else parts.push(type==="body"?{type:"body",title:"描写 1",text:t,done:false}:{type:"public",title:"公開情報 1",text:t,revealed:false,judged:false});
   sc.body=parts.filter(x=>x.type==="body").map(x=>x.text).join("\n\n");
   sc.info=parts.filter(x=>x.type==="public").map(x=>x.text).join("\n\n");
 }else sc.kp=(sc.kp?sc.kp+"\n\n":"")+t;
 save(); toast(`「${sc.title}」へ追加しました`);
}
