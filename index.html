<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>KP CONSOLE</title>
<style>
:root{
 --bg:#08111f;--panel:#0f1b2d;--panel2:#13243a;--line:#223957;--text:#e8eef7;
 --muted:#8fa2bb;--accent:#4aa3ff;--accent2:#7bc5ff;--danger:#e46d7a;--ok:#50c58a;
 --shadow:0 10px 30px rgba(0,0,0,.22)
}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(135deg,#07101c,#0b1627 55%,#0b1422);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:238px;position:sticky;top:0;height:100vh;padding:20px 14px;background:rgba(8,17,31,.96);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:4px 10px 22px}.brand b{font-size:18px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:5px}
.nav{display:grid;gap:5px}.nav button{background:transparent;border:1px solid transparent;color:#aebed1;text-align:left;border-radius:10px;padding:10px 12px}.nav button.active{background:#122943;border-color:#20456b;color:#fff}.nav button:hover{background:#102238}
.navBtn{display:flex;align-items:center;gap:10px;width:100%}
.sceneList{display:grid;gap:10px}.sceneCard{background:#0d1b2a;border:1px solid #213a50;border-radius:14px;padding:14px 16px}.sceneCard h3{margin:0 0 4px}.sceneNo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:#162b3e;color:#9ed5ff;font-weight:700}.scenePreview{margin-top:12px;display:grid;gap:7px;color:#b9c8d6;font-size:13px}.scenePreview>div{display:flex;gap:8px;line-height:1.5}.sceneTag{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;flex:none}.bodyTag{background:#173a59;color:#a9d9ff}.infoTag{background:#173d32;color:#a8e5ca}.kpTag{background:#452832;color:#ffc0c7}.sceneEditGrid{display:grid;grid-template-columns:1fr;gap:12px}.sceneArea{min-height:300px}.sceneBody{border-color:#28577d}.sceneInfo{border-color:#2b6855}.sceneKP{border-color:#6c3040}.pdfItem{padding:14px}.previewActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #213a50}.pdfPages{display:grid;gap:12px}.pdfPage{background:#0d1b2a;border:1px solid #293e52;border-radius:14px;padding:14px}.pageLabel{font-size:11px;font-weight:800;letter-spacing:.12em;color:#9ed5ff}.pdfPreviewText{width:100%;min-height:360px;margin:10px 0;resize:vertical;background:#f7f7f3;color:#17212b;border:1px solid #c9d0d6;font-family:inherit;line-height:1.7}.pdfPreviewText:focus{outline:2px solid #6aa4d0;outline-offset:1px}
@media(min-width:900px){.sceneEditGrid{grid-template-columns:1.4fr 1fr 1fr}.sceneArea{min-height:420px}}
@media(max-width:820px){.sceneCard .row.between{align-items:flex-start;gap:8px}.sceneCard .row.between>.row{flex-wrap:wrap;justify-content:flex-end}.previewActions{position:sticky;top:0;z-index:5;background:#0b1622;padding:10px 0}.pdfPreviewText{min-height:420px}}

.navIcon{display:inline-flex;align-items:center;justify-content:center;width:22px;min-width:22px;font-size:17px;line-height:1}
.hero{padding:22px}.hero h1{margin:4px 0 6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.stat{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0b1725}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{display:block;font-size:20px;margin-top:4px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:12px}.fileBtn{display:inline-flex;align-items:center;cursor:pointer}.fileBtn input{display:none}
.currentScene{border-color:#438fca;box-shadow:0 0 0 1px #438fca33}.nowCard{border-color:#2f6590}.progressLine{height:7px;background:#0a1522;border-radius:99px;overflow:hidden;margin:14px 0 6px}.progressLine span{display:block;height:100%;background:#4aa3ff;border-radius:99px}.sessionGrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}.sessionMain{grid-row:span 2}.sessionText{font-size:16px;line-height:1.9}.kpPanel{border-color:#6c3040;background:#171118}.sessionChecks{margin-top:14px}.check{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#0b1827;color:#c5d2e0}.check input{width:auto}.searchSnippet{color:#aab9ca;font-size:13px;line-height:1.5;margin-top:8px;max-width:850px}.searchCount{color:var(--muted);font-size:12px;margin-bottom:8px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.sessionGrid{grid-template-columns:1fr}.sessionMain{grid-row:auto}.sessionText{font-size:15px}}

.navText{display:inline}

.sidebottom{margin-top:auto;display:grid;gap:7px}.sidebottom button{background:#0f1b2d;border:1px solid var(--line);color:#b9c7d8;border-radius:10px;padding:9px}
.main{width:100%;min-width:0}.topbar{position:sticky;top:0;z-index:5;background:rgba(8,17,31,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center}
.scenarioSelect{max-width:420px;flex:1;background:#101f33;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.content{max-width:1180px;margin:auto;padding:20px}.topbar .btn{white-space:nowrap}
h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,rgba(17,31,50,.97),rgba(13,25,42,.97));border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.hero{padding:22px}.hero h1{font-size:27px;margin-bottom:6px}.eyebrow{font-size:12px;color:var(--accent2);letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d1b2d}.stat b{display:block;font-size:24px;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{font-size:12px;color:#aabbd0;font-weight:700;display:block;margin:9px 0 5px}input,textarea,select{width:100%;background:#091523;color:#eef5ff;border:1px solid #29415f;border-radius:10px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:#438fca;box-shadow:0 0 0 2px #438fca22}textarea{min-height:130px;resize:vertical}
.btn{border:1px solid #2e6a9d;background:#145386;color:#fff;border-radius:10px;padding:9px 12px}.btn:hover{filter:brightness(1.12)}.btn.ghost{background:#0d1b2d;border-color:var(--line);color:#c4d1df}.btn.danger{background:#4a1c26;border-color:#71303d;color:#ffd8de}.btn.ok{background:#174c3b;border-color:#286b53}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}
.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0c192a}.item:hover{border-color:#315a7e}.item .title{font-weight:700}.item .meta{font-size:11px;color:var(--muted);margin-top:4px}
.badge.pc{background:#102b46;color:#9ed5ff;border-color:#28577d}.badge.npc{background:#12332b;color:#9ee1c1;border-color:#2b6855}.badge.enemy{background:#351b24;color:#ffb7c0;border-color:#6c3040}.badge{font-size:10px;padding:3px 7px;border-radius:99px;background:#142a43;color:#9fcfff;border:1px solid #244b70}.badge.red{background:#321a22;color:#ffb4bf;border-color:#5d2b38}
.file{border:1px dashed #385572;border-radius:12px;padding:14px;background:#0a1726}.notice{border-left:3px solid var(--accent);padding:9px 11px;background:#0b1b2c;color:#b7c8da;border-radius:7px;font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.hidden{display:none!important}
a.link{color:#7fc5ff}.footer-note{font-size:11px;color:#71859c;margin-top:18px}
@media(max-width:820px){.sidebar{width:68px;padding:14px 8px}.brand b{font-size:0}.brand b:after{content:"✦";font-size:22px}.brand small{display:none}.nav button{font-size:0;text-align:center;padding:11px 4px}.nav .navIcon{font-size:18px;display:inline-flex;margin:auto}.nav .navText{display:none}.navBtn{justify-content:center;gap:0}.sidebottom{display:none}.content{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid,.grid3{grid-template-columns:1fr}.topbar{padding:10px}.scenarioSelect{max-width:none}.hero h1{font-size:23px}}

/* v8 responsive */
html,body{max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}
img{max-width:100%;height:auto}
.row{flex-wrap:wrap}
.card,.sceneCard,.item{min-width:0;overflow-wrap:anywhere}
button,.btn{min-height:42px}
input,select,textarea{max-width:100%}
.actionBar,.toolbar,.topbar,.header{min-height:52px;align-items:center}

@media(max-width:599px){
 body{font-size:14px}
 .app,.container,.main,.content{width:100%;max-width:100%;padding-left:10px;padding-right:10px}
 .topbar,.header,.toolbar{position:sticky;top:0;z-index:30;background:var(--bg,#07111d);padding:7px 10px}
 .topbar .row,.header .row,.toolbar .row{width:100%;gap:6px}
 .topbar .btn,.header .btn,.toolbar .btn{padding:7px 9px;font-size:12px;white-space:nowrap}
 .topbar select,.header select,.toolbar select{min-width:0;flex:1}
 .nav,.tabs,.navBar{display:flex;overflow-x:auto;overflow-y:hidden;white-space:nowrap;gap:5px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .nav::-webkit-scrollbar,.tabs::-webkit-scrollbar,.navBar::-webkit-scrollbar{display:none}
 .nav button,.tabs button,.navBar button{flex:0 0 auto}
 .navLabel{display:none}
 .hero{padding:16px}
 .hero h1{font-size:23px}
 .stats{grid-template-columns:repeat(2,1fr)!important;gap:7px}
 .stat{padding:10px}
 .grid,.sessionGrid,.sceneEditGrid{grid-template-columns:1fr!important}
 .sceneMain,.sessionMain{grid-row:auto}
 .sceneCard .row.between,.item .row.between{flex-direction:column;align-items:stretch}
 .sceneCard .row.between>.row,.item .row.between>.row{width:100%;justify-content:flex-end}
 .sceneArea{min-height:240px}
 .sessionText{font-size:15px;line-height:1.8}
 .sessionChecks{display:grid;grid-template-columns:1fr 1fr;width:100%}
 .modal,.dialog{width:calc(100vw - 20px);max-width:calc(100vw - 20px)}
}

@media(min-width:600px) and (max-width:1023px){
 .app,.container,.main,.content{max-width:100%;padding-left:16px;padding-right:16px}
 .grid{grid-template-columns:1fr 1fr}
 .sessionGrid{grid-template-columns:1.3fr 1fr}
 .sceneEditGrid{grid-template-columns:1fr 1fr}
 .sceneKP{grid-column:1/-1}
 .nav,.tabs,.navBar{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
}

@media(min-width:1024px){
 .app,.container,.main,.content{max-width:1200px;margin-left:auto;margin-right:auto}
 .nav,.tabs,.navBar{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><b>KP CONSOLE</b><small>Scenario Keeper Workspace</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebottom"><button onclick="renameScenario()">✎ シナリオ名を変更</button><button onclick="show('backup')">⇅ 保存・復元</button></div>
</aside>
<section class="main">
  <div class="topbar">
    <select id="scenarioSelect" class="scenarioSelect" onchange="switchScenario(this.value)"></select>
    <button class="btn ok" onclick="saveCurrentScenario()">✓ 保存</button>
    <button class="btn ghost" onclick="downloadCurrentScenario()">⇩ ファイル保存</button>
    <button class="btn danger" onclick="deleteScenario()">削除</button>
    <button class="btn" onclick="newScenario()">＋ 新しいシナリオ</button>
  </div>
  <main class="content" id="content"></main>
</section>
</div>
<script>
const KEY="kp_console_v6";
const NAV=[
 ["home","⌂","ホーム"],["session","▶","今ここ"],["search","⌕","検索"],["scenes","▤","シナリオ"],
 ["kp","✦","KP情報"],["ho","◇","HO・秘匿"],["pc","♙","PC・キャラクター"],
 ["npc","♧","NPC・登場人物"],["enemy","⚔","敵・エネミー"],["pdf","▣","PDF"],["prep","✓","準備"]
];
let store=load();
let tab="home";
function blankScenario(name="新しいシナリオ"){
 return {id:(crypto.randomUUID?.()||String(Date.now()+Math.random())),name,scenes:[],kpInfo:"",hos:[],pcs:[],
 actors:{npc:[],enemy:[]},pdfs:[],prep:{},bookmarks:[],session:{currentScene:0,checks:{}}}
}
function load(){
 try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x?.scenarios?.length)return x}catch(e){}
 const s=blankScenario("新しいシナリオ");return {scenarios:[s],currentId:s.id}
}
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function current(){return store.scenarios.find(s=>s.id===store.currentId)||store.scenarios[0]}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function init(){
 if(!store.scenarios?.length){const s=blankScenario();store.scenarios=[s];store.currentId=s.id}
 for(const s of store.scenarios){s.scenes??=[];s.hos??=[];s.pcs??=[];s.actors??={npc:[],enemy:[]};s.actors.npc??=[];s.actors.enemy??=[];
   for(const type of ["npc","enemy"]){for(const a of s.actors[type]){a.name??=type==="npc"?"NPC":"敵";a.hp??="";a.mp??="";a.dex??="";a.params??="";a.skills??="";a.commands??="";a.setting??="";a.memo??=""}}
   s.pdfs??=[];for(const p of s.pdfs){if(!Array.isArray(p.pageData)&&p.text)p.pageData=getPDFPages(p)}s.prep??={}}
 save();drawNav();drawScenario();render()
}
function drawNav(){
 document.getElementById("nav").innerHTML=NAV.map(n=>`<button class="navBtn ${tab===n[0]?'active':''}" onclick="show('${n[0]}')" title="${esc(n[2])}">
   <span class="navIcon">${n[1]}</span><span class="navText">${n[2]}</span>
 </button>`).join("")
}
function drawScenario(){document.getElementById("scenarioSelect").innerHTML=store.scenarios.map(s=>`<option value="${esc(s.id)}" ${s.id===store.currentId?'selected':''}>${esc(s.name)}</option>`).join("")}
function show(t){tab=t;drawNav();render()}
function repairCurrentData(){
 const s=current();
 s.scenes??=[];s.hos??=[];s.pcs??=[];s.actors??={npc:[],enemy:[]};
 s.actors.npc??=[];s.actors.enemy??=[];s.pdfs??=[];s.prep??={};s.kpInfo??="";
 s.bookmarks??=[];s.session??={currentScene:0,checks:{}};
 s.session.currentScene=Number.isInteger(s.session.currentScene)?s.session.currentScene:0;s.session.checks??={};
 for(const x of s.scenes){x.title??="無題";x.body??="";x.info??="";x.kp??="";x.tags??=[];x.checks??={body:false,info:false,judge:false,next:false}}
}function switchScenario(id){if(store.scenarios.some(s=>s.id===id)){store.currentId=id;save();render()}}
function newScenario(){const n=prompt("シナリオ名","新しいシナリオ");if(!n?.trim())return;const s=blankScenario(n.trim());store.scenarios.push(s);store.currentId=s.id;save();drawScenario();show("home")}
function saveCurrentScenario(){
 save();
 drawScenario();
 toast(`「${current().name}」を保存しました`);
}
function downloadCurrentScenario(){
 const s=current();
 const payload=JSON.stringify(s);
 const b=new Blob([payload],{type:"application/octet-stream"});
 const u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=(s.name.replace(/[\\/:*?"<>|]/g,"_")||"scenario")+".coc-kp";
 a.click();setTimeout(()=>URL.revokeObjectURL(u),500);
 toast("シナリオファイルを保存しました");
}
function renameScenario(){const s=current(),n=prompt("シナリオ名",s.name);if(n?.trim()){s.name=n.trim();save();drawScenario();render()}}
function deleteScenario(){if(store.scenarios.length===1)return alert("最後のシナリオは削除できません。");const s=current();if(!confirm(`「${s.name}」を削除しますか？`))return;store.scenarios=store.scenarios.filter(x=>x.id!==s.id);store.currentId=store.scenarios[0].id;save();drawScenario();show("home")}

function deleteScenarioById(id){
 const idx=scenarios.findIndex(x=>x.id===id); if(idx<0)return;
 if(!confirm(scenarios.length===1?"最後のシナリオを削除しますか？\n削除後は空の状態になります。":"このシナリオを削除しますか？\n登録した内容も削除されます。"))return;
 scenarios.splice(idx,1);
 if(!scenarios.length){const s=blankScenario("新しいシナリオ");scenarios.push(s);currentId=s.id}
 else currentId=scenarios[Math.max(0,idx-1)].id;
 saveAll();render();
}
function deletePdf(index){
 const s=current(); if(!s.pdfs[index])return;
 if(confirm(`「${s.pdfs[index].name||"PDF資料"}」を削除しますか？`)){s.pdfs.splice(index,1);save();render()}
}
function deleteActor(type,index){
 const a=current().actors[type]; if(!a[index])return;
 if(confirm(`「${a[index].name||"登録データ"}」を削除しますか？`)){a.splice(index,1);save();render()}
}
function deletePC(index){
 const a=current().pcs; if(!a[index])return;
 if(confirm(`「${a[index].name||"PC"}」を削除しますか？`)){a.splice(index,1);save();render()}
}
function deleteHO(index){
 const a=current().hos; if(!a[index])return;
 if(confirm(`「${a[index].name||"HO"}」を削除しますか？`)){a.splice(index,1);save();render()}
}
function render(){
 repairCurrentData();drawScenario();
 const c=document.getElementById("content");
 ({home,session,search,scenes,kp,ho,pc,npc:(x)=>actor(x,"npc"),enemy:(x)=>actor(x,"enemy"),pdf,prep}[tab]||home)(c);
}
function home(c){
 const s=current(),total=s.scenes.length,cur=Math.min(Math.max(s.session.currentScene||0,0),Math.max(total-1,0));
 const x=s.scenes[cur],done=x?Object.values(x.checks||{}).filter(Boolean).length:0;
 c.innerHTML=`<div class="hero card"><div class="eyebrow">KP DASHBOARD</div><h1>${esc(s.name)}</h1>
 <p class="muted">シナリオの準備から本番中の進行まで、ここをKP用の司令塔として使えます。</p>
 <div class="stats"><div class="stat"><span>シーン</span><b>${total}</b></div><div class="stat"><span>PDF資料</span><b>${s.pdfs.length}</b></div><div class="stat"><span>PC</span><b>${s.pcs.length}</b></div><div class="stat"><span>NPC / 敵</span><b>${s.actors.npc.length} / ${s.actors.enemy.length}</b></div></div></div>
 <div class="grid"><div class="card"><div class="row between"><div><div class="eyebrow">CURRENT</div><h2>${x?esc(x.title):"シーン未登録"}</h2><p class="muted small">${x?`シーン ${cur+1} / ${total}`:"まずシーンを作成してください。"}</p></div><button class="btn" onclick="show('session')">今ここを開く</button></div>
 ${x?`<div class="progressLine"><span style="width:${done*25}%"></span></div><div class="small muted">進行チェック ${done}/4</div>`:""}</div>
 <div class="card"><div class="eyebrow">QUICK SEARCH</div><h2>必要な情報を探す</h2><div class="row"><input id="homeSearch" placeholder="NPC名、技能、SAN、キーワード…" onkeydown="if(event.key==='Enter')runSearch(this.value)"><button class="btn" onclick="runSearch(document.getElementById('homeSearch').value)">検索</button></div></div></div>
 <div class="card"><div class="eyebrow">QUICK ACTION</div><div class="row"><button class="btn" onclick="addScene()">＋ シーン</button><button class="btn" onclick="show('pdf')">▣ PDFを整理</button><button class="btn" onclick="show('npc')">♧ NPC</button><button class="btn" onclick="show('enemy')">⚔ 敵</button><button class="btn ghost" onclick="show('prep')">✓ 準備チェック</button><button class="btn ghost" onclick="backup(document.getElementById('content'))">⇩ 保存・復元</button></div></div>`;
}function setCurrentScene(i){const s=current();if(!s.scenes.length)return;s.session.currentScene=Math.max(0,Math.min(i,s.scenes.length-1));save();show("session")}
function toggleSceneCheck(i,k,v){current().scenes[i].checks[k]=v;save()}
function session(c){
 const s=current(),total=s.scenes.length;
 if(!total){c.innerHTML='<div class="empty">シーンがまだありません。<br><button class="btn" onclick="addScene()">＋ シーンを作る</button></div>';return}
 const i=Math.max(0,Math.min(s.session.currentScene||0,total-1)),x=s.scenes[i],checks=x.checks||{};
 c.innerHTML=`<div class="card nowCard"><div class="row between"><div><div class="eyebrow">NOW PLAYING</div><h1>${esc(x.title)}</h1><div class="muted small">SCENE ${i+1} / ${total}</div></div><div class="row"><button class="btn ghost" onclick="setCurrentScene(${i-1})" ${i===0?"disabled":""}>← 前</button><button class="btn" onclick="setCurrentScene(${i+1})" ${i===total-1?"disabled":""}>次 →</button></div></div>
 <div class="row sessionChecks">${[["body","描写済み"],["info","情報提示済み"],["judge","判定済み"],["next","次への条件確認"]].map(([k,l])=>`<label class="check"><input type="checkbox" ${checks[k]?"checked":""} onchange="toggleSceneCheck(${i},'${k}',this.checked)"><span>${l}</span></label>`).join("")}</div></div>

function getPDFPages(p){
 if(Array.isArray(p.pageData)&&p.pageData.length)return p.pageData.map(x=>({page:x.page,text:x.text||""}));
 const chunks=String(p.text||"").split(/\n\n(?=【\d+ページ】)/).filter(Boolean);
 return chunks.map((x,i)=>{const m=x.match(/^【(\d+)ページ】\n?([\s\S]*)$/);return {page:m?Number(m[1]):i+1,text:m?m[2]:x}});
}

}

async function loadPDFjs(){

 // The module is loaded dynamically so normal app use does not depend on PDF.js.
 const mod=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
 mod.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
 window.pdfjsLib=mod;
 return mod;
}

async function readPDFs(e){
 const files=Array.from(e.target.files||[]);if(!files.length)return;
 const st=document.getElementById("pdfStatus"),pr=document.getElementById("prog"),ocrOn=document.getElementById("pdfOcr")?.checked!==false;
 pr.hidden=false;pr.value=0;
 try{
  const all=[];
  for(let fi=0;fi<files.length;fi++){
   const result=await extractPDFWithPDFJS(new Uint8Array(await files[fi].arrayBuffer()),ocrOn,(a,msg)=>{pr.value=(fi+a)/files.length;st.textContent=`${fi+1}/${files.length}：${msg}`});
   result.pages.forEach((text,pi)=>all.push({page:all.length+1,text,source:files[fi].name,sourcePage:pi+1}));
  }
  current().pdfs.push({name:files.length===1?files[0].name:`${files[0].name} ほか${files.length-1}冊`,pages:all.length,text:all.map(x=>`【${x.source} / ${x.sourcePage}ページ】\n${x.text}`).join("\n\n"),pageData:all,sources:files.map(f=>f.name)});
  save();st.textContent=`${files.length}冊を1つの資料として登録しました（${all.length}ページ）`;render();
 }catch(err){console.error(err);st.textContent="PDFを読み込めませんでした。"}
}
async function extractPDFWithPDFJS(bytes,doOCR,progress){
 const pdfjs=await loadPDFjs();
 const pdf=await pdfjs.getDocument({data:bytes}).promise;
 const pages=[],pageData=[];
 let worker=null;
 if(doOCR){
  if(!window.Tesseract)throw Error("OCR library unavailable");
  progress(0.02,"OCRエンジンを準備しています…");
  worker=await Tesseract.createWorker("jpn+eng",1,{
    logger:m=>{
      if(m.status==="recognizing text"){
        const pct=Number(m.progress||0);
        progress(Math.min(.98,(pageData.length+(pct))/pdf.numPages),"OCR中…");
      }
    }
  });
 }
 try{
  for(let n=1;n<=pdf.numPages;n++){
   progress((n-1)/pdf.numPages,`PDFを解析中… ${n}/${pdf.numPages}ページ`);
   const page=await pdf.getPage(n);
   const tc=await page.getTextContent();
   const text=tc.items.map(x=>x.str).join(" ").replace(/[ \t]+\n/g,"\n").trim();
   let combined=text;
   let ocr="";
   if(doOCR){
    const viewport=page.getViewport({scale:1.6});
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    const r=await worker.recognize(canvas);
    ocr=(r.data?.text||"").trim();
    // Avoid doubling ordinary PDF text; OCR is primarily used to catch image/boxed text.
    if(ocr && text){
      const norm=a=>a.replace(/\s+/g,"").replace(/[「」『』【】（）()［］\[\]：:、,。．.]/g,"").toLowerCase();
      const a=norm(text),b=norm(ocr);
      combined=b.length>0 && (a.length<80 || b.length>a.length*1.15) ? `${text}\n\n【画像・図・枠内OCR】\n${ocr}` : text;
    }else combined=ocr||text;
    canvas.width=canvas.height=1;
   }
   pages.push(combined||"（このページから文字を抽出できませんでした）");
   pageData.push({page:n,text:combined||"",hasOCR:!!ocr});
  }
 }finally{
  if(worker)await worker.terminate();
 }
 progress(1,"読み込み完了");
 return {pages,pageData};
}
